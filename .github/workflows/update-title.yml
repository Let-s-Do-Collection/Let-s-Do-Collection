name: Update Issue Title with Mod Prefix

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - name: Prefix title with mod name
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body ?? "";
            const title = issue.title ?? "";

            const match = body.match(/###\s*Mod\s*\n+([^\n]+)/i);
            if (!match) return;

            let mod = match[1].trim();
            if (!mod || mod === "_No response_") return;
            if (mod.startsWith("Multiple")) mod = "Multiple";

            let cleaned = title.replace(/^\[MOD_ID\]:\s*/, "").trim();
            if (cleaned.startsWith("[") && !title.startsWith("[MOD_ID]")) return;
            if (!cleaned) cleaned = "Untitled issue";

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              title: `[${mod}] ${cleaned}`,
            });

            const label = mod
              .toLowerCase()
              .replace(/&/g, "and")
              .replace(/'/g, "")
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-|-$/g, "");

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [label],
            });
