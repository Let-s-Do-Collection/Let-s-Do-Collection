name: Bug Report
description: Report a bug, crash or unexpected behavior in a Let's Do mod.
type: Bug
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!

        ⚠ **Before you start**
        - Minecraft **1.21.1 requires Java 21**
        - Unsupported Minecraft versions will be closed
        - Questions and support requests belong on [Discord](https://discord.gg/Vqu6wYZwdZ), not here
        - Have an idea instead? Please use the **Suggestion** template
        - Please write in **English**

  - type: checkboxes
    id: preflight
    attributes:
      label: Checklist
      options:
        - label: I am using the **latest version** of the mod and its dependencies.
          required: true
        - label: I have searched existing issues and this has not been reported yet.
          required: true

  - type: dropdown
    id: mod
    attributes:
      label: Mod
      options:
        - All that flies is not just Wings
        - AlpineWhispers
        - Bakery
        - Beachparty
        - BloomingNature
        - Brewery
        - Camping
        - Candlelight
        - Farm & Charm
        - Furniture
        - Grime & Gloss
        - Harvestfall
        - Hearth & Timber
        - HerbalBrews
        - Legacy
        - Lili's Lucky Lures
        - Lili's Pottery
        - Meadow
        - Smoker
        - Vinery
        - WilderNature
        - Multiple / interaction between Let's Do mods
    validations:
      required: true

  - type: input
    id: mod_version
    attributes:
      label: Mod Version
      description: Found in the .jar file name or the in-game mod menu.
      placeholder: e.g. 1.5.3
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What kind of problem is it?
      options:
        - Crash
        - Rendering / Visual
        - Gameplay / Mechanics
        - Recipes / Loot / Tags
        - World Generation
        - Compatibility with other mods
        - Performance
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Fabric
        - NeoForge
    validations:
      required: true

  - type: input
    id: loader_version
    attributes:
      label: Loader & Dependency Versions
      description: Fabric Loader / NeoForge version, plus Fabric API and Architectury API if used.
      placeholder: e.g. Fabric Loader 0.16.5, Fabric API 0.105.0, Architectury 13.0.8
    validations:
      required: false

  - type: dropdown
    id: minecraft_version
    attributes:
      label: Minecraft Version
      options:
        - "1.21.1"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does the issue occur?
      multiple: true
      options:
        - Singleplayer
        - Dedicated server
        - LAN / open to LAN
    validations:
      required: true

  - type: dropdown
    id: minimal_instance
    attributes:
      label: Minimal Instance Test
      description: Does the issue still happen with only this mod and its required dependencies installed?
      options:
        - Yes, it also happens on a minimal instance
        - No, it only happens in my modpack
        - Not tested
    validations:
      required: true

  - type: input
    id: modpack
    attributes:
      label: Modpack (optional)
      description: If it only happens in a modpack, name and version.
      placeholder: e.g. Cozy Farming Pack 2.3.47

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: logs
    attributes:
      label: Logs
      description: |
        Upload `logs/latest.log` (and `crash-reports/…` if the game crashed) to https://mclo.gs and paste the link.
        **Required for crashes.** Please do not paste raw logs here.
      placeholder: https://mclo.gs/abcdef
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos (optional)
      description: Drag & drop images or videos here.
